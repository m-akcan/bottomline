services:
  bottomline:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/m-akcan/bottomline:latest
    container_name: bottomline
    restart: unless-stopped
    ports:
      - "${BOTTOMLINE_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      DATABASE_PATH: /app/data/bottomline.db
    volumes:
      - bottomline-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  bottomline-data:
